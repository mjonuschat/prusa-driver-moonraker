name: Container image

# Builds the server image of a release, checks it, pushes it to GitHub's
# container registry and signs it.
#
# The image is named after the repository this runs in: ghcr.io/<owner>/<repository>,
# in lowercase. Two ways in:
#   - release.yml calls it for every release, after the release is published
#   - by hand, from the Actions tab, naming a release that already exists. That
#     pushes only the exact version tag unless move-tags is set.
#
# The version is validated, and the tag and the GitHub release must exist. The
# Dockerfile and the scripts that build the image come from the release's tag, so
# an old release is rebuilt the way it was released.
on:
  workflow_call:
    inputs:
      version:
        description: The release to publish, with or without its leading v
        required: true
        type: string
      move-tags:
        description: Also move X.Y, X and latest, where this release is the highest of its scope
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish, such as 0.1.0-beta.1
        required: true
        type: string
      move-tags:
        description: Also move X.Y, X and latest, where this release is the highest of its scope
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  # GitHub evaluates the environment against the ref that started the run, so the
  # release environment allows main and the v* tags only.
  publish:
    name: Publish the container image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      # Push to ghcr.io with the job's own GITHUB_TOKEN. No stored credential.
      packages: write
      # cosign signs with a short-lived certificate for this job's OIDC token.
      id-token: write
    steps:
      # The workflow's own ref comes first, so the validation below is trusted code.
      - name: Checkout the triggering ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -eu
          version=${INPUT#v}
          sh scripts/verify-release.sh version "$version" >> "$GITHUB_OUTPUT"
          # GitHub keeps the owner's capitals, and a registry refuses an image name with one.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check the release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release view "v${VERSION}" > /dev/null

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ steps.version.outputs.version }}
          submodules: recursive
          persist-credentials: false

      - name: Gather the build arguments
        id: args
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCS_URL: ${{ vars.DOCS_URL || 'https://beta.prusa3d.com/connect-local/docs/{version}/' }}
        run: |
          set -eu
          {
            echo "build_args<<ARGS"
            echo "GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')"
            echo "BUILD_VERSION=$VERSION"
            echo "DOCS_URL=$DOCS_URL"
            echo "ARGS"
          } >> "$GITHUB_OUTPUT"
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The exact version only. The floating tags move in the last step.
      - name: Choose the tag and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ env.REVISION }}
          flavor: |
            latest=false

      - name: Build the amd64 image for the checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: moonraker-server:release
          build-args: ${{ steps.args.outputs.build_args }}

      - name: Check the image runs as non-root
        run: bash prusa-connect/scripts/check-container-nonroot.sh moonraker-server:release

      - name: Probe the image the way a deployment does
        run: bash prusa-connect/scripts/check-container-probes.sh moonraker-server:release

      - name: Confirm a privileged port is served by a non-root process
        run: bash prusa-connect/scripts/check-container-privileged-port.sh moonraker-server:release

      - name: Start the image with the shipped config
        run: sh scripts/test/image.test.sh moonraker-server:release

      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 64-bit only. A 32-bit Raspberry Pi runs the armv7 binary instead.
      - name: Build and push every platform
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: ${{ steps.args.outputs.build_args }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless: the certificate names this workflow file and the ref it ran from,
      # and there is no key to rotate. Signed by digest, so it covers every tag.
      - name: Sign the image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Last, so a failure above moves no floating tag. The tags come from the API,
      # which needs no git credentials, and scripts/floating-tags.sh decides which
      # ones this release may move.
      - name: Move the floating tags
        if: inputs.move-tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          TAGS=$(gh api "repos/${GH_REPO}/tags" --paginate --jq '.[].name')
          export TAGS
          for tag in $(sh scripts/floating-tags.sh "$VERSION"); do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
          done
