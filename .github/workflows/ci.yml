name: CI

# Checks every change: Go lint and tests, the Moonraker page, a composed server
# build, the scripts' own tests, the Docker image, and a vulnerability scan.
# release.yml calls this workflow, so a tag runs the same checks as main.
#
# ci-ok is the one check branch protection names. It fails when any job it needs
# did not succeed, and no job may skip, so there are no path filters here.
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    # Weekly, so a new advisory is found when nothing else changed.
    - cron: '30 6 * * 1'
  workflow_call:

# A pull request keeps only its newest run. Every other event gets a group that
# includes the run id, so a pending run is never discarded. A call from the
# release reports the caller's event, so it takes the second form.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The core's web app, built once for the jobs that embed it. The cache is an
  # optimisation: a miss rebuilds. Only main writes it.
  web-app:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: prusa-connect/packages/typescript/package.json

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: prusa-connect/.nvmrc
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Name the cache
        id: cache-key
        run: echo "key=web-app-$(git rev-parse HEAD:prusa-connect)-${{ hashFiles('prusa-connect/**/pnpm-lock.yaml', 'prusa-connect/Makefile', 'prusa-connect/cmd/compress-app/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the web app
        id: restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: prusa-connect/internal/transport/http/httpapi/appdist
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build the web app
        if: steps.restore.outputs.cache-hit != 'true'
        run: make -C prusa-connect embed-app

      - name: Save the web app
        if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: prusa-connect/internal/transport/http/httpapi/appdist
          key: ${{ steps.cache-key.outputs.key }}

      # A placeholder-only appdist compiles and serves no page.
      - name: Check the web app is there
        run: test -f prusa-connect/internal/transport/http/httpapi/appdist/index.html

      - name: Upload the web app
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-web-app
          path: prusa-connect/internal/transport/http/httpapi/appdist
          retention-days: 7

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --timeout=15m

  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Run the tests under the race detector
        run: go test -race ./...

  # The Moonraker page. Its workspace links the core's built packages, so those
  # are built before the install.
  ui:
    name: Moonraker page
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: module/ui/package.json

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: prusa-connect/.nvmrc
          package-manager-cache: false

      - name: Build the core packages the page links
        run: make -C prusa-connect client-sdk-build client-ui-build

      - name: Install the page's dependencies
        working-directory: module/ui
        run: pnpm install --frozen-lockfile

      - name: Lint and check the format
        working-directory: module/ui
        run: pnpm run lint && pnpm run format:check

      # svelte-check also reports type errors inside the core's own package
      # sources, which this module does not own. The script accepts only those,
      # and fails on a crash or on any other error.
      - name: Type-check the page's own sources
        working-directory: module/ui
        run: |
          set +e
          pnpm exec svelte-check --tsconfig ./tsconfig.json --output machine > "$RUNNER_TEMP/svelte-check.log"
          status=$?
          set -e
          cat "$RUNNER_TEMP/svelte-check.log"
          sh ../../scripts/svelte-check-filter.sh "$RUNNER_TEMP/svelte-check.log" "$status"

      - name: Build the page
        working-directory: module/ui
        run: pnpm run build

      - name: Upload the page
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ci-ui-dist
          path: module/ui/dist
          retention-days: 7

  build:
    name: Composed server
    needs: [ web-app, ui ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download the web app
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-web-app
          path: prusa-connect/internal/transport/http/httpapi/appdist

      - name: Download the page
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ci-ui-dist
          path: module/ui/dist

      - name: Build the server
        run: sh scripts/build-server.sh linux amd64 "" 0.0.0-ci "$RUNNER_TEMP/server"

      - name: Start it with the shipped config
        run: sh scripts/test/config.test.sh "$RUNNER_TEMP/server" module/ui/dist

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Read the Go version go.mod pins
        id: go_version
        run: echo "go_version=$(grep '^go ' go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.go_version.outputs.go_version }}
          cache: false
          repo-checkout: false

  dockerfile-sync:
    name: Dockerfile sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check docker/Dockerfile still matches the core's
        run: sh scripts/check-dockerfile-sync.sh

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint the workflows
        run: actionlint

      - name: Lint the scripts
        run: shellcheck -x install.sh scripts/*.sh scripts/test/*.sh

  # The behavioural tests of every script. The smoke tests need a built server
  # and image, and run in build and image.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # The release notes test runs git-cliff, so it is installed from a pinned
      # release and checked against its checksum.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: 2.14.2
          GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4
        run: |
          set -eu
          archive="$RUNNER_TEMP/git-cliff.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          cp "$RUNNER_TEMP/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" "$HOME/.local/bin/git-cliff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run the script tests
        run: make test-scripts

  # The image built from a clean context, held to the core's own container
  # checks and to the shipped config. It never leaves the runner.
  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        run: docker buildx build --load --platform linux/amd64 -f docker/Dockerfile -t moonraker-server:ci .

      - name: Check it runs as an unprivileged user
        run: bash prusa-connect/scripts/check-container-nonroot.sh moonraker-server:ci

      - name: Check its probes and shutdown
        run: bash prusa-connect/scripts/check-container-probes.sh moonraker-server:ci

      - name: Check it binds a privileged port without capabilities
        run: bash prusa-connect/scripts/check-container-privileged-port.sh moonraker-server:ci

      - name: Start it with the shipped config
        run: sh scripts/test/image.test.sh moonraker-server:ci

  ci-ok:
    name: CI OK
    if: always()
    needs: [ web-app, lint, test, ui, build, vuln, dockerfile-sync, workflows, scripts, image ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check every job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: sh scripts/check-needs.sh
